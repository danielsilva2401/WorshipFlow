name: Build WorshipFlow PWA - Smart Song Recommendations

on:
  push:
    branches: [ feature/pwa-smart-song-recommendations ]
    paths:
      - ".github/workflows/build-pwa-song-recommendations.yml"
      - "features/pwa-smart-song-recommendations/**"
      - "scripts/apply_pwa_smart_suggestions.py"

permissions:
  contents: read

jobs:
  build-pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test recommendation engine
        run: node --experimental-default-type=module --test features/pwa-smart-song-recommendations/recommendations.test.mjs

      - name: Reconstruct current WorshipFlow source
        run: |
          mkdir -p appsrc
          cat v54-src-part00.b64 v54-src-part01.b64 v54-src-part02.b64 \
              v54-src-tail00.b64 v54-src-tail01.b64 v54-src-tail02.b64 \
              v54-src-tail03.b64 v54-src-tail04.b64 v54-src-tail05.b64 \
              v54-src-tail06.b64 | tr -d '\n\r ' > source-v54.b64
          base64 -d source-v54.b64 > source-v54.tgz
          tar -tzf source-v54.tgz >/dev/null
          tar -xzf source-v54.tgz -C appsrc
          PKG=$(find "$GITHUB_WORKSPACE/appsrc" -name package.json -not -path "*/node_modules/*" | head -1)
          if [ -z "$PKG" ]; then
            echo "package.json não encontrado."
            exit 1
          fi
          APP_DIR=$(dirname "$PKG")
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Apply stable PWA layers
        run: |
          python3 scripts/apply_v54.py "$APP_DIR"
          python3 scripts/apply_v55.py "$APP_DIR"
          python3 scripts/apply_v56.py "$APP_DIR"

      - name: Apply smart song recommendations
        run: python3 scripts/apply_pwa_smart_suggestions.py "$APP_DIR"

      - name: Configure Firebase Web and YouTube
        env:
          VITE_YOUTUBE_API_KEY: ${{ secrets.VITE_YOUTUBE_API_KEY }}
        run: |
          echo "VITE_FIREBASE_API_KEY=AIzaSyBylMmRmB2-0xVNGL0pb8abnRsWKKZP4C4" > "$APP_DIR/.env.production"
          echo "VITE_FIREBASE_AUTH_DOMAIN=worshipflow-f99f6.firebaseapp.com" >> "$APP_DIR/.env.production"
          echo "VITE_FIREBASE_PROJECT_ID=worshipflow-f99f6" >> "$APP_DIR/.env.production"
          echo "VITE_FIREBASE_APP_ID=1:678699277566:web:c9115862cfac49485319af" >> "$APP_DIR/.env.production"
          printf 'VITE_YOUTUBE_API_KEY=%s\n' "$VITE_YOUTUBE_API_KEY" >> "$APP_DIR/.env.production"

      - name: Install dependencies and validate app tests
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install --no-audit --no-fund
          if [ -d tests ]; then
            mapfile -t TEST_FILES < <(find tests -maxdepth 1 -type f \( -name "*.test.mjs" -o -name "*.test.js" \) | sort)
            if [ "${#TEST_FILES[@]}" -gt 0 ]; then
              node --test "${TEST_FILES[@]}"
            fi
          fi

      - name: Build PWA
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

      - name: Upload PWA artifact
        uses: actions/upload-artifact@v4
        with:
          name: worshipflow-pwa-smart-song-recommendations
          path: ${{ env.APP_DIR }}/dist
          if-no-files-found: error
          retention-days: 14
