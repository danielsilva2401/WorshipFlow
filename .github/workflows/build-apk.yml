name: Build WorshipFlow APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "source.tgz.b64"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extrair fonte sanitizada
        run: |
          base64 -d source.tgz.b64 > source.tgz
          tar -xzf source.tgz
          test -f app/package.json

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Instalar dependências
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Build web
        working-directory: app
        run: npm run build

      - name: Criar projeto Android
        working-directory: app
        run: npx cap add android

      - name: Sincronizar Capacitor
        working-directory: app
        run: npx cap sync android

      - name: Compilar APK debug
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Copiar APK
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk WorshipFlow-v52-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WorshipFlow-v52-APK
          path: WorshipFlow-v52-debug.apk
          if-no-files-found: error
          retention-days: 30
