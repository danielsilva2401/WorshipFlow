name: Build WorshipFlow APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-apk.yml"
      - "source.tgz.b64"
      - "v54-src-*.b64"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Extrair fonte v52 base
        run: |
          mkdir -p appsrc
          cat v54-src-part00.b64 v54-src-part01.b64 v54-src-part02.b64 \
              v54-src-tail00.b64 v54-src-tail01.b64 v54-src-tail02.b64 \
              v54-src-tail03.b64 v54-src-tail04.b64 v54-src-tail05.b64 \
              v54-src-tail06.b64 | tr -d '\n\r ' > source-v54.b64
          echo "Validando pacote de fonte v54..."
          base64 -d source-v54.b64 > source-v54.tgz
          tar -tzf source-v54.tgz >/dev/null
          tar -xzf source-v54.tgz -C appsrc
          PKG=$(find "$GITHUB_WORKSPACE/appsrc" -name package.json -not -path "*/node_modules/*" | head -1)
          if [ -z "$PKG" ]; then
            echo "package.json não encontrado no source.tgz.b64"
            exit 1
          fi
          APP_DIR=$(dirname "$PKG")
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Fonte encontrada em $APP_DIR"

      - name: Aplicar melhorias v54 em Cifras
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          root=Path(os.environ["APP_DIR"])
          app=root/"src"/"App.jsx"
          s=app.read_text()

          # Estados v54: usa regex para não depender de espaços exatos do fonte.
          s, n = re.subn(
              r'\[lookingUp,\s*setLookingUp\]\s*=\s*useState\(false\),\s*\n\s*\[savingCifra,\s*setSavingCifra\]\s*=\s*useState\(false\),',
              '[lookingUp, setLookingUp] = useState(false),\n    [lookupError, setLookupError] = useState(""),\n    [lookupAttempt, setLookupAttempt] = useState(0),\n    [savingCifra, setSavingCifra] = useState(false),',
              s,
              count=1
          )
          if n != 1:
              raise SystemExit("Estado lookingUp da cifra não encontrado")

          # Troca somente a rotina assíncrona de busca entre setLookingUp e o cleanup do effect.
          pattern = re.compile(
              r'setLookingUp\(!hasSavedChartForVariant\);\s*\n\s*\(async \(\) => \{.*?\}\)\(\)\.finally\(\(\) => \{\s*if \(active\) \{\s*setLookingUp\(false\);\s*\}\s*\}\);',
              re.S
          )
          new_lookup = '''setLookingUp(!hasSavedChartForVariant);
    setLookupError("");
    setLookupAttempt(0);

    const withTimeout = (promise, ms) => Promise.race([
      promise,
      new Promise((_, reject) => setTimeout(() => reject(new Error("Tempo limite da busca atingido.")), ms)),
    ]);

    (async () => {
      let current = song;
      const attempts = hasSavedChartForVariant ? 1 : 2;
      let lastError = null;
      for (let attempt = 0; attempt < attempts && active; attempt += 1) {
        setLookupAttempt(attempt + 1);
        try {
          const next = await withTimeout(autoLookup(current, {
            force: !hasSavedChartForVariant,
            variant,
            lyricsTimeoutMs: hasSavedChartForVariant ? 3500 : 5200,
          }), hasSavedChartForVariant ? 5500 : 9000);
          if (!active) return;
          if (next) {
            current = next;
            setResolvedSong(next);
            if (hasSavedChartForVariant || hasUsableChords(next)) {
              setLookupError("");
              return;
            }
          }
        } catch (error) {
          lastError = error;
          console.warn(`Tentativa ${attempt + 1} de cifra não concluiu:`, error);
        }
        if (attempt < attempts - 1 && active) await wait(900);
      }
      if (active && !hasSavedChartForVariant && !hasUsableChords(current)) {
        setLookupError(lastError?.message || "Não encontramos acordes automaticamente agora.");
      }
    })().finally(() => {
      if (active) {
        setLookingUp(false);
        setLookupAttempt(0);
      }
    });'''
          s, n = pattern.subn(new_lookup, s, count=1)
          if n != 1:
              raise SystemExit("Rotina assíncrona da cifra não encontrada")

          old_status='<span><strong>Buscando letra + cifra automaticamente…</strong><small>Localizando a letra, identificando o título correto e preparando os acordes para o WorshipFlow.</small></span>'
          new_status='<span><strong>Buscando letra + cifra automaticamente…</strong><small>{lookupAttempt > 1 ? "Tentando uma rota alternativa de acordes. Isso leva só mais alguns segundos." : "Consultando as fontes disponíveis em paralelo e preparando os acordes para o WorshipFlow."}</small></span>'
          if old_status not in s:
              raise SystemExit("Texto de carregamento da cifra não encontrado")
          s=s.replace(old_status,new_status,1)

          retry_pattern=re.compile(
              r'\{!lookingUp\s*&&\s*transientInternetLyrics\s*&&\s*activeSong\.lyrics_runtime_kind\s*!==\s*"lyrics\+chords"\s*&&\s*\(\s*<Button className="secondary wide" icon=\{RefreshCw\} onClick=\{\(\) => setLookupNonce\(\(value\) => value \+ 1\)\}>\s*Tentar buscar acordes novamente\s*</Button>\s*\)\}',
              re.S
          )
          new_retry='''{!lookingUp && lookupError && !chart && (
        <div className="cifra-source-note cifra-lookup-error">
          <RefreshCw size={16} />
          <span><strong>A busca automática não concluiu</strong><small>{lookupError} Você pode tentar novamente agora ou abrir a busca do Cifra Club abaixo.</small></span>
        </div>
      )}
      {!lookingUp && ((transientInternetLyrics && activeSong.lyrics_runtime_kind !== "lyrics+chords") || (lookupError && !chart)) && (
        <Button className="secondary wide" icon={RefreshCw} onClick={() => { setLookupError(""); setLookupNonce((value) => value + 1); }}>
          Tentar buscar acordes novamente
        </Button>
      )}'''
          s, n = retry_pattern.subn(new_retry, s, count=1)
          if n != 1:
              raise SystemExit("Botão de retry da cifra não encontrado")

          s=s.replace(
              'setVariant("simplified");\n                if (!song.chords)',
              'setVariant("simplified");\n                setLookupError("");\n                if (!song.chords)',
              1
          )
          s=s.replace(
              'setVariant("principal");\n                if (!song.chords)',
              'setVariant("principal");\n                setLookupError("");\n                if (!song.chords)',
              1
          )

          app.write_text(s)

          cifra=root/"src"/"cifraclub.js"
          c=cifra.read_text()
          lookup_pattern=re.compile(
              r'// v44: primeiro usa o Cloudflare Worker gratuito\..*?if\(!found\) found=await tryRawProxyPages\(base,fetcher,Math\.min\(timeoutMs,6000\)\);',
              re.S
          )
          new_resolver='''// v54: fontes principais em paralelo para não prender a interface numa fonte lenta.
            const primary=await Promise.allSettled([
              tryCloudflareBackend(base,fetcher,Math.min(timeoutMs,8000),requestedVariant),
              tryReader(base,fetcher,Math.min(timeoutMs,7000)),
              tryRecifraReader(base,fetcher,Math.min(timeoutMs,7000)),
            ]);
            const primaryResults=primary
              .filter(item=>item.status==='fulfilled' && item.value)
              .map(item=>item.value)
              .sort((a,b)=>cifraCompletenessScore(b)-cifraCompletenessScore(a));
            let found=primaryResults[0] || null;
            if(!found) found=await tryLegacyApi(base,fetcher,Math.min(timeoutMs,3500));
            if(!found) found=await tryRawProxyPages(base,fetcher,Math.min(timeoutMs,4500));'''
          c, n = lookup_pattern.subn(new_resolver, c, count=1)
          if n != 1:
              raise SystemExit("Resolvedor Cifra Club não encontrado")
          cifra.write_text(c)

          css=root/"src"/"style.css"
          cs=css.read_text()
          if ".cifra-lookup-error" not in cs:
              cs += '\n.cifra-lookup-error{border-color:rgba(255,168,76,.28);background:rgba(255,168,76,.08)}.cifra-lookup-error>svg{color:#ffb35c}html[data-theme="light"] .cifra-lookup-error{background:#fff7ed;border-color:rgba(234,88,12,.2)}\n'
          css.write_text(cs)

          pkg=root/"package.json"
          ps=pkg.read_text()
          ps=re.sub(r'"version"\s*:\s*"[^"]+"','"version": "1.0.54"',ps,count=1)
          pkg.write_text(ps)

          cap=root/"capacitor.config.json"
          cfg=cap.read_text().replace('"skipNativeAuth": true','"skipNativeAuth": false')
          cap.write_text(cfg)

          print("Melhorias v54 aplicadas com sucesso.")
          PY

      - name: Instalar dependências e testar cifra
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install --no-audit --no-fund
          node --test             tests/saved-cifra-v50.test.mjs             tests/v51-stability.test.mjs             tests/cifra-v44.test.mjs             tests/cifra-v46-variants.test.mjs             tests/cifra-v47-serverless-source.test.mjs             tests/cifraclub-lookup.test.mjs             tests/cifraclub-resolver-v23.test.mjs             tests/cifraclub-ui.test.mjs

      - name: Build web v54
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

      - name: Gerar projeto Android local
        working-directory: ${{ env.APP_DIR }}
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Configurar Firebase Android
        run: |
          cat > "$APP_DIR/android/app/google-services.json" <<'EOF'
          {
            "project_info": {
              "project_number": "678699277566",
              "project_id": "worshipflow-f99f6",
              "storage_bucket": "worshipflow-f99f6.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:678699277566:android:b679ab29c8f4f60a5319af",
                  "android_client_info": {
                    "package_name": "com.worshipflow.app"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "678699277566-vlk25mdcb6f5mpthhiau7ur0g1uelh8q.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyDwryZL0MWzeU3IDcL8oeNCUXWpdS7rudg"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "678699277566-vlk25mdcb6f5mpthhiau7ur0g1uelh8q.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import os, re
          root=Path(os.environ["APP_DIR"])
          gradle=root/"android"/"build.gradle"
          s=gradle.read_text()
          if "com.google.gms:google-services" not in s:
              s=s.replace("dependencies {","dependencies {\n        classpath 'com.google.gms:google-services:4.4.3'",1)
          gradle.write_text(s)

          app=root/"android"/"app"/"build.gradle"
          s=app.read_text()
          if "com.google.gms.google-services" not in s:
              s=s.rstrip()+"\n\napply plugin: 'com.google.gms.google-services'\n"
          s=re.sub(r'versionCode\s+\d+','versionCode 540',s)
          s=re.sub(r'versionName\s+"[^"]+"','versionName "1.0.54"',s)
          app.write_text(s)

          vars=root/"android"/"variables.gradle"
          s=vars.read_text()
          if "rgcfaIncludeGoogle" not in s:
              s=s.rstrip()+"\n\next {\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = '1.3.0'\n}\n"
          vars.write_text(s)
          PY

          cd "$APP_DIR"
          npx cap update android
          npx cap sync android

      - name: Aplicar ícone PWA no Android
        run: |
          mkdir -p "$APP_DIR/android/app/src/main/res/drawable-nodpi"
          curl -fsSL "https://worshipflow-f99f6.web.app/icons/icon-512.png?v=21"             -o "$APP_DIR/android/app/src/main/res/drawable-nodpi/wf_pwa_icon.png"

          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p=Path(os.environ["APP_DIR"])/"android"/"app"/"src"/"main"/"AndroidManifest.xml"
          s=p.read_text()
          s=re.sub(r'android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/wf_pwa_icon"', s)
          s=re.sub(r'android:roundIcon="@mipmap/ic_launcher_round"', 'android:roundIcon="@drawable/wf_pwa_icon"', s)
          p.write_text(s)
          PY

      - name: Compilar APK release
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Assinar e validar APK
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "Secrets de assinatura Android não configurados."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > worshipflow-release.jks

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -p -f 4             "$APP_DIR/android/app/build/outputs/apk/release/app-release-unsigned.apk"             WorshipFlow-v54-aligned.apk

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign             --ks worshipflow-release.jks             --ks-key-alias "$ANDROID_KEY_ALIAS"             --ks-pass pass:"$ANDROID_KEYSTORE_PASSWORD"             --key-pass pass:"$ANDROID_KEYSTORE_PASSWORD"             --out WorshipFlow-v54.apk             WorshipFlow-v54-aligned.apk

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs WorshipFlow-v54.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WorshipFlow-v54
          path: WorshipFlow-v54.apk
          if-no-files-found: error
          retention-days: 30
