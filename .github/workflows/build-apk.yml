name: Build WorshipFlow APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Criar shell Android WorshipFlow
        run: |
          mkdir -p app/www
          cd app
          npm init -y
          npm install --no-audit --no-fund @capacitor/core@8.5.2 @capacitor/android@8.5.2 @capacitor/cli@8.5.2
          printf '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorshipFlow</title></head><body><p>Carregando WorshipFlow...</p></body></html>' > www/index.html
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.worshipflow.app",
            "appName": "WorshipFlow",
            "webDir": "www",
            "server": {
              "url": "https://worshipflow-f99f6.web.app",
              "cleartext": false
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Definir versão v52
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/android/app/build.gradle")
          s=p.read_text()
          s=s.replace("versionCode 1", "versionCode 52")
          s=s.replace('versionName "1.0"', 'versionName "1.0.52"')
          p.write_text(s)
          PY

      - name: Compilar APK debug
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Copiar APK
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk WorshipFlow-v52-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WorshipFlow-v52-APK
          path: WorshipFlow-v52-debug.apk
          if-no-files-found: error
          retention-days: 30
