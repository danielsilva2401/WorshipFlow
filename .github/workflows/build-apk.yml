name: Build WorshipFlow APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Criar shell Android com Google nativo
        run: |
          mkdir -p app/www
          cd app
          npm init -y
          npm install --no-audit --no-fund \
            @capacitor/core@8.5.2 \
            @capacitor/android@8.5.2 \
            @capacitor/cli@8.5.2 \
            @capacitor-firebase/authentication@8.5.2 \
            firebase@12.0.0

          printf '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorshipFlow</title></head><body><p>Carregando WorshipFlow...</p></body></html>' > www/index.html

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.worshipflow.app",
            "appName": "WorshipFlow",
            "webDir": "www",
            "server": {
              "url": "https://worshipflow-f99f6.web.app",
              "cleartext": false
            },
            "plugins": {
              "FirebaseAuthentication": {
                "skipNativeAuth": false,
                "providers": ["google.com"]
              }
            }
          }
          EOF

          npx cap add android

      - name: Adicionar Firebase Android
        run: |
          cat > app/android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "678699277566",
              "project_id": "worshipflow-f99f6",
              "storage_bucket": "worshipflow-f99f6.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:678699277566:android:b679ab29c8f4f60a5319af",
                  "android_client_info": {
                    "package_name": "com.worshipflow.app"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "678699277566-6u8u6ah8le6a41dbuv2bb5567l1nvnm4.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.worshipflow.app",
                      "certificate_hash": "97c55aa425dcb522f82d6b2f48945aeeedabf9c3"
                    }
                  },
                  {
                    "client_id": "678699277566-vlk25mdcb6f5mpthhiau7ur0g1uelh8q.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyDwryZL0MWzeU3IDcL8oeNCUXWpdS7rudg"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "678699277566-vlk25mdcb6f5mpthhiau7ur0g1uelh8q.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/android/variables.gradle")
          s = p.read_text()
          if "rgcfaIncludeGoogle" not in s:
              s = s.rstrip() + "\n\next {\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = '1.3.0'\n}\n"
          p.write_text(s)

          root = Path("app/android/build.gradle")
          s = root.read_text()
          needle = "dependencies {"
          if "com.google.gms:google-services" not in s:
              s = s.replace(needle, needle + "\n        classpath 'com.google.gms:google-services:4.4.3'", 1)
          root.write_text(s)

          app = Path("app/android/app/build.gradle")
          s = app.read_text()
          if "com.google.gms.google-services" not in s:
              s = s.rstrip() + "\n\napply plugin: 'com.google.gms.google-services'\n"
          app.write_text(s)
          PY

          cd app
          npx cap update android
          npx cap sync android

      - name: Injetar login Google nativo na PWA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          js = r"""
          (() => {
            if (window.__WF_NATIVE_GOOGLE_LOGIN__) return;
            window.__WF_NATIVE_GOOGLE_LOGIN__ = true;

            const isGoogleButton = (node) => {
              const el = node && node.closest ? node.closest('button,a,[role="button"]') : null;
              if (!el) return null;
              return /entrar\s+com\s+google/i.test((el.innerText || el.textContent || '').trim()) ? el : null;
            };

            document.addEventListener('click', async (event) => {
              const button = isGoogleButton(event.target);
              if (!button) return;

              const nativeAuth = window.Capacitor?.Plugins?.FirebaseAuthentication;
              if (!nativeAuth?.signInWithGoogle) return;

              event.preventDefault();
              event.stopPropagation();
              event.stopImmediatePropagation();

              const oldText = button.innerText;
              button.disabled = true;
              button.innerText = 'Entrando com Google...';

              try {
                const result = await nativeAuth.signInWithGoogle();
                const idToken = result?.credential?.idToken || null;
                const accessToken = result?.credential?.accessToken || null;

                if (!idToken && !accessToken) {
                  throw new Error('O Google não retornou credenciais.');
                }

                const appMod = await import('https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js');
                const authMod = await import('https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js');

                const firebaseConfig = {
                  apiKey: 'AIzaSyBylMmRmB2-0xVNGL0pb8abnRsWKKZP4C4',
                  authDomain: 'worshipflow-f99f6.firebaseapp.com',
                  projectId: 'worshipflow-f99f6',
                  appId: '1:678699277566:web:c9115862cfac49485319af'
                };

                const app = appMod.getApps().length ? appMod.getApp() : appMod.initializeApp(firebaseConfig);
                const auth = authMod.getAuth(app);
                await authMod.setPersistence(auth, authMod.browserLocalPersistence);
                const credential = authMod.GoogleAuthProvider.credential(idToken, accessToken);
                await authMod.signInWithCredential(auth, credential);

                window.location.reload();
              } catch (error) {
                console.error('WorshipFlow native Google login:', error);
                alert('Não foi possível entrar com Google. ' + (error?.message || 'Tente novamente.'));
                button.disabled = false;
                button.innerText = oldText;
              }
            }, true);
          })();
          """

          encoded = json.dumps(js)
          java = f'''package com.worshipflow.app;

          import android.os.Bundle;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebViewClient;

          public class MainActivity extends BridgeActivity {{
              private boolean nativeLoginInjected = false;
              private static final String LOGIN_JS = {encoded};

              @Override
              public void onResume() {{
                  super.onResume();
                  if (nativeLoginInjected || getBridge() == null || getBridge().getWebView() == null) return;

                  WebView webView = getBridge().getWebView();
                  webView.setWebViewClient(new BridgeWebViewClient(getBridge()) {{
                      @Override
                      public void onPageFinished(WebView view, String url) {{
                          super.onPageFinished(view, url);
                          if (url != null && url.startsWith("https://worshipflow-f99f6.")) {{
                              view.evaluateJavascript(LOGIN_JS, null);
                          }}
                      }}
                  }});

                  String current = webView.getUrl();
                  if (current != null && current.startsWith("https://worshipflow-f99f6.")) {{
                      webView.evaluateJavascript(LOGIN_JS, null);
                  }}
                  nativeLoginInjected = true;
              }}
          }}
          '''
          Path("app/android/app/src/main/java/com/worshipflow/app/MainActivity.java").write_text(java)
          PY

      - name: Definir versão v52.1
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/android/app/build.gradle")
          s=p.read_text()
          s=s.replace("versionCode 1", "versionCode 521")
          s=s.replace('versionName "1.0"', 'versionName "1.0.52.1"')
          p.write_text(s)
          PY

      - name: Compilar APK release sem assinatura
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Copiar APK
        run: |
          cp app/android/app/build/outputs/apk/release/app-release-unsigned.apk WorshipFlow-v52.1-unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WorshipFlow-v52.1-unsigned
          path: WorshipFlow-v52.1-unsigned.apk
          if-no-files-found: error
          retention-days: 30
