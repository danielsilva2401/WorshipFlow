name: Build WorshipFlow APK
# WorshipFlow Android v53

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Criar shell Android com Google nativo
        run: |
          mkdir -p app/www
          cd app
          npm init -y
          npm install --no-audit --no-fund \
            @capacitor/core@8.5.2 \
            @capacitor/android@8.5.2 \
            @capacitor/cli@8.5.2 \
            @capacitor-firebase/authentication@8.5.2 \
            firebase@12.19.0

          printf '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorshipFlow</title></head><body><p>Carregando WorshipFlow...</p></body></html>' > www/index.html

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.worshipflow.app",
            "appName": "WorshipFlow",
            "webDir": "www",
            "server": {
              "url": "https://worshipflow-f99f6.web.app",
              "cleartext": false
            },
            "plugins": {
              "FirebaseAuthentication": {
                "skipNativeAuth": false,
                "providers": ["google.com"]
              }
            }
          }
          EOF

          npx cap add android

      - name: Adicionar Firebase Android
        run: |
          cat > app/android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "678699277566",
              "project_id": "worshipflow-f99f6",
              "storage_bucket": "worshipflow-f99f6.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:678699277566:android:b679ab29c8f4f60a5319af",
                  "android_client_info": {
                    "package_name": "com.worshipflow.app"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "678699277566-6u8u6ah8le6a41dbuv2bb5567l1nvnm4.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.worshipflow.app",
                      "certificate_hash": "97c55aa425dcb522f82d6b2f48945aeeedabf9c3"
                    }
                  },
                  {
                    "client_id": "678699277566-vlk25mdcb6f5mpthhiau7ur0g1uelh8q.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyDwryZL0MWzeU3IDcL8oeNCUXWpdS7rudg"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "678699277566-vlk25mdcb6f5mpthhiau7ur0g1uelh8q.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/android/variables.gradle")
          s = p.read_text()
          if "rgcfaIncludeGoogle" not in s:
              s = s.rstrip() + "\n\next {\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = '1.3.0'\n}\n"
          p.write_text(s)

          root = Path("app/android/build.gradle")
          s = root.read_text()
          needle = "dependencies {"
          if "com.google.gms:google-services" not in s:
              s = s.replace(needle, needle + "\n        classpath 'com.google.gms:google-services:4.4.3'", 1)
          root.write_text(s)

          app = Path("app/android/app/build.gradle")
          s = app.read_text()
          if "com.google.gms.google-services" not in s:
              s = s.rstrip() + "\n\napply plugin: 'com.google.gms.google-services'\n"
          app.write_text(s)
          PY

          cd app
          npx cap update android
          npx cap sync android

      - name: Injetar login Google nativo na PWA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          js = r"""
          (() => {
            if (window.__WF_NATIVE_GOOGLE_LOGIN__) return;
            window.__WF_NATIVE_GOOGLE_LOGIN__ = true;

            const isGoogleButton = (node) => {
              const el = node && node.closest ? node.closest('button,a,[role="button"]') : null;
              if (!el) return null;
              return /entrar\s+com\s+google/i.test((el.innerText || el.textContent || '').trim()) ? el : null;
            };

            document.addEventListener('click', async (event) => {
              const button = isGoogleButton(event.target);
              if (!button) return;

              const nativeAuth = window.Capacitor?.Plugins?.FirebaseAuthentication;
              if (!nativeAuth?.signInWithGoogle) return;

              event.preventDefault();
              event.stopPropagation();
              event.stopImmediatePropagation();

              const oldText = button.innerText;
              button.disabled = true;
              button.innerText = 'Entrando com Google...';

              try {
                const result = await nativeAuth.signInWithGoogle();
                const idToken = result?.credential?.idToken || null;
                const accessToken = result?.credential?.accessToken || null;

                if (!idToken && !accessToken) {
                  throw new Error('O Google não retornou credenciais.');
                }

                const appMod = await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js');
                const authMod = await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js');

                const firebaseConfig = {
                  apiKey: 'AIzaSyBylMmRmB2-0xVNGL0pb8abnRsWKKZP4C4',
                  authDomain: 'worshipflow-f99f6.firebaseapp.com',
                  projectId: 'worshipflow-f99f6',
                  appId: '1:678699277566:web:c9115862cfac49485319af'
                };

                const app = appMod.getApps().length ? appMod.getApp() : appMod.initializeApp(firebaseConfig);
                const auth = authMod.getAuth(app);
                await authMod.setPersistence(auth, authMod.browserLocalPersistence);
                const credential = authMod.GoogleAuthProvider.credential(idToken, accessToken);
                await authMod.signInWithCredential(auth, credential);

                window.location.reload();
              } catch (error) {
                console.error('WorshipFlow native Google login:', error);
                alert('Não foi possível entrar com Google. ' + (error?.message || 'Tente novamente.'));
                button.disabled = false;
                button.innerText = oldText;
              }
            }, true);
          })();
          """

          encoded = json.dumps(js)
          java = f'''package com.worshipflow.app;

          import android.os.Bundle;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebViewClient;

          public class MainActivity extends BridgeActivity {{
              private boolean nativeLoginInjected = false;
              private static final String LOGIN_JS = {encoded};

              @Override
              public void onResume() {{
                  super.onResume();
                  if (nativeLoginInjected || getBridge() == null || getBridge().getWebView() == null) return;

                  WebView webView = getBridge().getWebView();
                  webView.setWebViewClient(new BridgeWebViewClient(getBridge()) {{
                      @Override
                      public void onPageFinished(WebView view, String url) {{
                          super.onPageFinished(view, url);
                          if (url != null && url.startsWith("https://worshipflow-f99f6.")) {{
                              view.evaluateJavascript(LOGIN_JS, null);
                          }}
                      }}
                  }});

                  String current = webView.getUrl();
                  if (current != null && current.startsWith("https://worshipflow-f99f6.")) {{
                      webView.evaluateJavascript(LOGIN_JS, null);
                  }}
                  nativeLoginInjected = true;
              }}
          }}
          '''
          Path("app/android/app/src/main/java/com/worshipflow/app/MainActivity.java").write_text(java)
          PY

      - name: Aplicar acabamento nativo v53
        run: |
          python3 - <<'PY'
          from pathlib import Path

          res = Path("app/android/app/src/main/res")
          (res/"values").mkdir(parents=True, exist_ok=True)
          (res/"values-v31").mkdir(parents=True, exist_ok=True)
          (res/"drawable").mkdir(parents=True, exist_ok=True)
          (res/"mipmap-anydpi-v26").mkdir(parents=True, exist_ok=True)

          (res/"values"/"colors.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <resources>
            <color name="wf_bg">#0B1020</color>
            <color name="wf_primary">#7C3AED</color>
            <color name="wf_white">#FFFFFF</color>
          </resources>
          """)

          (res/"drawable"/"ic_worshipflow_foreground.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#7C3AED" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#FFFFFF"
              android:pathData="M22,31 L32,31 L40,67 L49,42 L59,42 L68,67 L76,31 L86,31 L75,79 L64,79 L54,54 L44,79 L33,79 Z"/>
          </vector>
          """)

          (res/"mipmap-anydpi-v26"/"ic_launcher.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/wf_bg"/>
            <foreground android:drawable="@drawable/ic_worshipflow_foreground"/>
          </adaptive-icon>
          """)
          (res/"mipmap-anydpi-v26"/"ic_launcher_round.xml").write_text((res/"mipmap-anydpi-v26"/"ic_launcher.xml").read_text())

          (res/"drawable"/"wf_splash.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
            <item android:drawable="@color/wf_bg"/>
            <item android:gravity="center">
              <inset android:inset="72dp">
                <bitmap android:gravity="center" android:src="@mipmap/ic_launcher"/>
              </inset>
            </item>
          </layer-list>
          """)

          (res/"values"/"styles.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <resources>
            <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
              <item name="colorPrimary">@color/wf_primary</item>
              <item name="colorPrimaryDark">@color/wf_bg</item>
              <item name="colorAccent">@color/wf_primary</item>
            </style>
            <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:colorAccent">@color/wf_primary</item>
              <item name="android:navigationBarColor">@color/wf_bg</item>
              <item name="android:statusBarColor">@color/wf_bg</item>
              <item name="android:windowLightStatusBar">false</item>
            </style>
            <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
              <item name="android:windowBackground">@drawable/wf_splash</item>
            </style>
          </resources>
          """)

          (res/"values-v31"/"styles.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <resources>
            <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
              <item name="android:windowSplashScreenBackground">@color/wf_bg</item>
              <item name="android:windowSplashScreenAnimatedIcon">@mipmap/ic_launcher</item>
              <item name="android:windowSplashScreenIconBackgroundColor">@color/wf_bg</item>
            </style>
          </resources>
          """)

          java = Path("app/android/app/src/main/java/com/worshipflow/app/MainActivity.java")
          text = java.read_text()
          text = text.replace("import android.os.Bundle;", """import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.webkit.WebResourceRequest;""")

          text = text.replace("""                      @Override
                      public void onPageFinished(WebView view, String url) {""", """                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          String host = uri.getHost() == null ? "" : uri.getHost();
                          if (host.endsWith("worshipflow-f99f6.web.app") || host.endsWith("worshipflow-f99f6.firebaseapp.com")) {
                              return false;
                          }
                          try {
                              Intent intent = new Intent(Intent.ACTION_VIEW, uri);
                              startActivity(intent);
                              return true;
                          } catch (Exception ignored) {
                              return false;
                          }
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {""")

          text = text.replace("""              }
          }
          ''',""","""              }

              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  if (getBridge() != null && getBridge().getWebView() != null && getBridge().getWebView().canGoBack()) {
                      getBridge().getWebView().goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          ''',""")
          java.write_text(text)
          PY

      - name: Definir versão v53
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/android/app/build.gradle")
          s=p.read_text()
          s=s.replace("versionCode 1", "versionCode 530")
          s=s.replace('versionName "1.0"', 'versionName "1.0.53"')
          p.write_text(s)
          PY

      - name: Compilar APK release
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Assinar e validar APK
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "Secrets de assinatura Android não configurados."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > worshipflow-release.jks

          $ANDROID_HOME/build-tools/36.0.0/zipalign -p -f 4             app/android/app/build/outputs/apk/release/app-release-unsigned.apk             WorshipFlow-v53-aligned.apk

          $ANDROID_HOME/build-tools/36.0.0/apksigner sign             --ks worshipflow-release.jks             --ks-key-alias "$ANDROID_KEY_ALIAS"             --ks-pass pass:"$ANDROID_KEYSTORE_PASSWORD"             --key-pass pass:"$ANDROID_KEYSTORE_PASSWORD"             --out WorshipFlow-v53.apk             WorshipFlow-v53-aligned.apk

          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs WorshipFlow-v53.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WorshipFlow-v53
          path: WorshipFlow-v53.apk
          if-no-files-found: error
          retention-days: 30
